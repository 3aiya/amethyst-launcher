name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Fabric 1.21.1 instance
        2. Install Sodium from Browse
        3. Press Play
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version and loader
      placeholder: "1.21.1, Fabric 0.16.5"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the game log or launcher error output, if any.
      render: shell
